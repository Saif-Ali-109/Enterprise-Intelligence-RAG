# Alembic configuration.
#
# `script_location` is where this file is, relative to the file itself, so the
# path is the same on every machine and every clone. The database URL is NOT
# here: it is read from the environment in migrations/env.py, so no credential
# ever lives in version control (FR-042). The value below is a placeholder that
# env.py replaces unconditionally.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
# Compare against the models' declared metadata. A migration that does not
# change the resulting schema is a migration that should not have been written.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Nothing rewrites files after a migration is written. A hook that reformats a
# migration changes its content hash, which makes "has this migration changed
# since it was applied?" unanswerable from version control alone.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
