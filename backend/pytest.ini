[pytest]
# Paths are repo-relative. Nothing in this repository resolves differently on
# another machine (see tasks.md, "Paths in code and specs").
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --strict-config
    -ra
markers =
    unit: pure logic, no network, no database
    integration: requires a real dependency (PostgreSQL, Pinecone, Groq)
    e2e: question to answer to validated citations
    contract: validates against specs/001-enterprise-knowledge-rag/contracts/
    performance: latency and throughput checks (SC-016, SC-017)
filterwarnings =
    error::DeprecationWarning:app.*
    ignore::DeprecationWarning
